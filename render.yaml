services:
  # 1. Django REST API Web Service (100% Free Plan)
  - type: web
    name: documind-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DATA
        value: "true"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"

  # 2. React Frontend Single Page App (100% Free Plan Forever)
  - type: web
    name: documind-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: documind-api
          property: host
