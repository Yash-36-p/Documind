services:
  # 1. Django REST API Web Service
  - type: web
    name: documind-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: standard
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DATA
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: documind-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: documind-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"

  # 2. Celery Background OCR & Processing Worker
  - type: worker
    name: documind-celery-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: celery -A config worker -l INFO --concurrency=2
    plan: standard
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: documind-postgres
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: documind-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: documind-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: RUN_MIGRATIONS
        value: "false"

  # 3. Redis Message Broker
  - type: redis
    name: documind-redis
    ipAllowList: []
    plan: starter

  # 4. React Frontend (Single Page Application)
  - type: web
    name: documind-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: documind-api
          property: host

databases:
  # 5. PostgreSQL Database
  - name: documind-postgres
    plan: standard
    databaseName: documind
    user: documind
